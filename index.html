<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pet Mold — Login</title>
  <style>
    :root {
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --blue-soft: #eff6ff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #dbe4f0;
      --bg: #f5f9ff;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.10), transparent 34%),
        radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.08), transparent 30%),
        var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(420px, 100%);
      background: var(--white);
      border: 1px solid rgba(219, 228, 240, 0.9);
      border-radius: 20px;
      box-shadow: 0 20px 55px rgba(15, 23, 42, 0.10);
      padding: 34px;
    }

    .brand {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: var(--blue);
      color: white;
      font-weight: 800;
      font-size: 20px;
      margin-bottom: 22px;
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.25);
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 9px 0 26px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 650;
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 11px;
      outline: none;
      background: #fff;
      color: var(--text);
      font-size: 14px;
      transition: border-color .15s, box-shadow .15s;
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.10);
    }

    .password-input {
      padding-right: 70px !important;
    }

    .toggle-password {
      position: absolute;
      right: 9px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      padding: 7px 8px;
      border-radius: 8px;
    }

    .toggle-password:hover {
      background: var(--blue-soft);
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 4px 0 22px;
    }

    .remember {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .remember input {
      width: 15px;
      height: 15px;
      accent-color: var(--blue);
    }

    .link {
      color: var(--blue);
      text-decoration: none;
      font-size: 13px;
      font-weight: 650;
    }

    .link:hover {
      text-decoration: underline;
    }

    .submit {
      width: 100%;
      height: 49px;
      border: 0;
      border-radius: 11px;
      background: var(--blue);
      color: white;
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
      transition: background .15s, transform .05s;
      box-shadow: 0 10px 22px rgba(37, 99, 235, 0.20);
    }

    .submit:hover {
      background: var(--blue-dark);
    }

    .submit:active {
      transform: translateY(1px);
    }

    .status {
      min-height: 20px;
      margin-top: 14px;
      text-align: center;
      color: #dc2626;
      font-size: 12px;
    }

    .signup {
      margin-top: 22px;
      padding-top: 21px;
      border-top: 1px solid #edf2f7;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 26px 20px;
        border-radius: 18px;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>
<body>
  <main class="card" aria-label="Authentication">
    <div class="brand">P</div>

    <section id="loginView">
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to continue to Pet Mold.</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email"
                 placeholder="you@example.com" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input id="password" name="password" class="password-input"
                   type="password" autocomplete="current-password"
                   placeholder="Enter your password" minlength="6" required />
            <button type="button" class="toggle-password" id="togglePassword">Show</button>
          </div>
        </div>

        <div class="row">
          <label class="remember">
            <input id="remember" type="checkbox" />
            <span>Remember me</span>
          </label>
          <a class="link" href="#" id="forgotLink">Forgot password?</a>
        </div>

        <button class="submit" type="submit">Sign in</button>
        <div class="status" id="loginStatus" role="status" aria-live="polite"></div>
      </form>

      <div class="signup">
        Don't have an account?
        <a class="link" href="#" id="showSignup">Create one</a>
      </div>
    </section>

    <section id="signupView" hidden>
      <h1>Create account</h1>
      <p class="subtitle">Make an account to save your Pet Mold progress.</p>

      <form id="signupForm" novalidate>
        <div class="field">
          <label for="signupName">Username</label>
          <input id="signupName" type="text" autocomplete="username"
                 placeholder="Choose a username" minlength="3" maxlength="24" required />
        </div>

        <div class="field">
          <label for="signupEmail">Email</label>
          <input id="signupEmail" type="email" autocomplete="email"
                 placeholder="you@example.com" required />
        </div>

        <div class="field">
          <label for="signupPassword">Password</label>
          <div class="input-wrap">
            <input id="signupPassword" class="password-input" type="password"
                   autocomplete="new-password" placeholder="Create a password"
                   minlength="6" required />
            <button type="button" class="toggle-password" data-target="signupPassword">Show</button>
          </div>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <div class="input-wrap">
            <input id="confirmPassword" class="password-input" type="password"
                   autocomplete="new-password" placeholder="Repeat your password"
                   minlength="6" required />
            <button type="button" class="toggle-password" data-target="confirmPassword">Show</button>
          </div>
        </div>

        <button class="submit" type="submit">Create account</button>
        <div class="status" id="signupStatus" role="status" aria-live="polite"></div>
      </form>

      <div class="signup">
        Already have an account?
        <a class="link" href="#" id="showLogin">Back to sign in</a>
      </div>
    </section>
  </main>

  <script>
    const loginView = document.getElementById("loginView");
    const signupView = document.getElementById("signupView");

    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");

    const loginStatus = document.getElementById("loginStatus");
    const signupStatus = document.getElementById("signupStatus");

    function showLogin() {
      loginView.hidden = false;
      signupView.hidden = true;
      loginStatus.textContent = "";
      signupStatus.textContent = "";
    }

    function showSignup() {
      loginView.hidden = true;
      signupView.hidden = false;
      loginStatus.textContent = "";
      signupStatus.textContent = "";
      document.getElementById("signupName").focus();
    }

    document.getElementById("showSignup").addEventListener("click", (event) => {
      event.preventDefault();
      showSignup();
    });

    document.getElementById("showLogin").addEventListener("click", (event) => {
      event.preventDefault();
      showLogin();
    });

    document.querySelectorAll(".toggle-password").forEach((button) => {
      button.addEventListener("click", () => {
        const input = document.getElementById(button.dataset.target || "password");
        const hidden = input.type === "password";
        input.type = hidden ? "text" : "password";
        button.textContent = hidden ? "Hide" : "Show";
      });
    });

    loginForm.addEventListener("submit", (event) => {
      event.preventDefault();
      loginStatus.style.color = "#dc2626";
      loginStatus.textContent = "";

      const email = document.getElementById("email");

      if (!email.checkValidity()) {
        loginStatus.textContent = "Enter a valid email address.";
        email.focus();
        return;
      }

      if (document.getElementById("password").value.length < 6) {
        loginStatus.textContent = "Password must be at least 6 characters.";
        document.getElementById("password").focus();
        return;
      }

      // Demo only — connect this form to Netlify/Auth later.
      loginStatus.style.color = "#2563eb";
      loginStatus.textContent = "Login form is ready for backend authentication.";
    });

    signupForm.addEventListener("submit", (event) => {
      event.preventDefault();
      signupStatus.style.color = "#dc2626";
      signupStatus.textContent = "";

      const username = document.getElementById("signupName");
      const email = document.getElementById("signupEmail");
      const password = document.getElementById("signupPassword");
      const confirm = document.getElementById("confirmPassword");

      if (username.value.trim().length < 3) {
        signupStatus.textContent = "Username must be at least 3 characters.";
        username.focus();
        return;
      }

      if (!email.checkValidity()) {
        signupStatus.textContent = "Enter a valid email address.";
        email.focus();
        return;
      }

      if (password.value.length < 6) {
        signupStatus.textContent = "Password must be at least 6 characters.";
        password.focus();
        return;
      }

      if (password.value !== confirm.value) {
        signupStatus.textContent = "Passwords do not match.";
        confirm.focus();
        return;
      }

      // Demo only — no account is created until a backend is connected.
      signupStatus.style.color = "#2563eb";
      signupStatus.textContent = "Sign-up form is ready for backend authentication.";
    });

    document.getElementById("forgotLink").addEventListener("click", (event) => {
      event.preventDefault();
      loginStatus.style.color = "#2563eb";
      loginStatus.textContent = "Password reset will be connected to your backend.";
    });
  </script>
</body>
</html>
